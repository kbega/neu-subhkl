name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Linting + formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Run linting
        run: |
          uv run ruff format --diff
          uv run ruff check

  test-unit:
    name: Unit tests
    strategy:
      matrix:
        python-version: ["3.12"]
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    # A single test, test_1_to_n_goniometer_mapping, is 80-90% of this job: it
    # runs the indexer with refine_goniometer=True, so a global search dominates.
    # It measured 28.6 min on main and 46.1 min here, against a whole-job budget
    # of 35 and 60+ respectively, which left no room for hosted-runner variance.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -v -m "not slow and not integration" --durations=25
